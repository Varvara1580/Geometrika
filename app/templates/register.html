<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icon2.png" type="image/png">
    <title>Геометрия</title>
    <style>
        body
        {
        background-image: url('/img/green4.png');
        background-size: cover;
        color: #fcfcfc;
        text-align: center;
        }

        a
        {
        color: #fcfcfc;
        }

        button
        {
        background-color: #02fa30;
        }
    </style>
</head>
<body>
    <h1>Зарегистрироваться</h1>
    {% if message %}
        <h2>{{ message }}</h2>
    {% endif %}
    <form method = 'POST' action = '/register'>
        <input name = 'name' placeholder = 'Имя'><br><br>
        <input name = 'surname' placeholder = 'Фамилия'><br><br>
        <input name = 'username' placeholder = 'Логин'><br><br>
        <input name = 'password' placeholder = 'Пароль'><br><br>
        <select name = 'role'>
            <option value = 'user'>Пользователь</option>
            <option value = 'admin'>Администратор</option>
        </select><br>
        <label>Пароль для администратора</label><br>
        <input type = 'text' name = 'admin_password' value = 'Текст по умолчанию'><br>
        <button type = 'submit'>Зарегистрироваться</button>
    </form>
    <a href = '/login'>Войти</a>
</body>
</html>
