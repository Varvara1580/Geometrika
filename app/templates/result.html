<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icon2.png" type="image/png">
    <title>Геометрия</title>
    <style>
        body
        {
        text-align: center;
        color: #fcfcfc;
        background-image: url('/img/green4.png');
        background-size: cover;
        }

        .neprav_triangle
        {
            display: flex;
            justify-content: center;
        }

        .img_neprav_triangle
        {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 400px;
            max-height: 400px;
        }
        a
        {
        color: #fcfcfc;
        }
    </style>
</head>
<body>
    <div class = 'result'>
        <h1>Ваш результат: {{ progress }} / {{ kolvo }}</h1>
    </div>

    <div class = 'neprav_triangle'>
        {% if progress >= 0.75 * kolvo %}
            <img class = 'img_neprav_triangle' src = '/img/neprav_triangle.png'>
        {% endif %}

        {% if progress < 0.75 * kolvo %}
            <img class = 'img_neprav_triangle' src = '/img/neprav_triangle_sad.png'>
        {% endif %}
    </div>

    <div class = 'link'>
        <a href = '/'>На главную</a>
        <br>
        <a href = '/user'>Личный кабинет</a>
        <br>
        <a href = '/logout'>Выйти</a>
    </div>

</body>
</html>
